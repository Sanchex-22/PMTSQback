name = "mi-worker-cloudflare" # Elige un nombre único
main = "dist/worker.js" # O la ruta a tu script de worker compilado, ej: src/index.ts si usas TypeScript y wrangler lo compila
compatibility_date = "2024-06-17" # Usa la fecha actual o una recomendada

[build]
command = "npm run build:worker" # Si necesitas un paso de compilación para tu worker
# O si tu worker es un archivo simple, puedes omitir el [build] command y apuntar 'main' directamente a él.